name: Windows CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build-test:
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_ADD_GLOBAL_TOOLS_TO_PATH: 'false'
      DOTNET_CLI_HOME: ${{ github.workspace }}/.dotnet-home
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    steps:
      # Official GitHub action, pinned to the verified v7.0.1 commit (Node.js 24).
      # The temporary read-only github.token supports public and private repos.
      - name: Checkout event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false
          set-safe-directory: false
      - name: Verify installed SDK
        run: dotnet --version
      - name: Restore official test dependencies
        run: dotnet restore BigzOS.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build BigzOS.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test BigzOS.slnx --configuration Release --no-build --no-restore

